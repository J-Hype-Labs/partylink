layout: stat
title: 고정비 0원, 승인된 손님만큼만
stat: 10,000원
stat_label: 승인된 게스트 1인당 기본 수수료\n(부가세 별도)
points:
  - head: 가입비·월 고정비 0원
    body: 승인된 게스트 수수료 외에 내는 돈이 없습니다
  - head: 오지 않으면 0원
    body: 노쇼·반려·취소된 신청에는 수수료가 없습니다
  - head: 선불 적립금 방식
    body: 미리 충전한 적립금에서 승인 시점에 자동 차감합니다
  - head: 남은 적립금 환불
    body: 사용하지 않은 잔액은 환불을 요청할 수 있습니다
example: "예) 10명 모집에서 8명 승인\n→ 80,000원 차감"
notes: |
  기본 수수료는 업체별로 협의해 조정할 수 있습니다(모집 건별 설정 가능).
  수수료는 선정 시점에 고정되어, 이후 수수료를 바꿔도 이미 선정된 게스트 금액은 그대로입니다.
