layout: cards
title: 파티를 열어도 자리가 다 차지 않습니다
lead: 점주님들께 가장 많이 들은 세 가지 고민입니다
cards:
  - head: 비는 좌석
    body: 평일·이른 시간대 파티는\n정원을 채우기 어렵고,\n빈 자리는 그대로\n손실이 됩니다
  - head: 불확실한 광고 효과
    body: 노출 광고는\n돈을 먼저 내야 하고,\n실제로 몇 명이 왔는지\n확인하기 어렵습니다
  - head: 못 믿을 체험단 리뷰
    body: 방문하지 않은 리뷰나\n영수증만 받은 리뷰는\n매장 신뢰를\n오히려 떨어뜨립니다
notes: |
  업체 상황에 맞게 사례를 하나 덧붙이면 좋습니다.
