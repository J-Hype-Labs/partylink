layout: stat
title: 12월 6일까지, 적립금 부가세만큼 할인
stat: 30만 원
stat_label: 30만 원 적립금 충전 시 결제 금액\n(원래 33만 원)
points:
  - head: 부가세만큼 할인
    body: 적립금 충전 시 부가세 10%를 받지 않습니다
  - head: 예시
    body: 30만 원 충전 → 33만 원이 아닌 30만 원 결제
  - head: 기간
    body: 2026년 12월 6일(일)까지 충전한 적립금
  - head: 세팅 대행
    body: 모집 페이지와 미션 조건을 저희가 준비합니다
example: "제안서를 받은 혼술바만\n받을 수 있는 혜택입니다"
notes: |
  운영: 혜택 기간 내 충전은 입금액 = 적립금(예: 30만 원 입금 → 30만 원 충전)으로 처리한다. 평소에는 33만 원 입금 → 30만 원 충전.
  세무: 할인한 금액이라도 결제액 30만 원에 부가세가 포함된 것으로 세금계산서를 발행해야 하므로 공급가액·세액 처리 방법은 세무 담당과 확인한다.
  1회 충전 상한이나 횟수 제한이 정해지면 이 슬라이드에 추가한다.
