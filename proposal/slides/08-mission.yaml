layout: mission
title: 리뷰 미션은 매장에 맞게 정합니다
lead: 사진 수·해시태그 같은 형식만 정하고, 별점·평가 내용은 요구하지 않습니다. 아래는 예시입니다
fields:
  - [플랫폼, 인스타그램]
  - [형식, 피드 게시물]
  - [사진, 3장 이상]
  - [해시태그, "#매장명 #HypeConnect"]
  - [유지 기간, 30일]
  - [협찬 표시, "'체험단 혜택 제공' 표기 필수"]
caption: 최종 조건은 첫 모집 등록 때 함께 정합니다
notes: |
  대가를 받은 후기는 그 사실을 밝혀야 합니다(공정위 추천·보증 심사지침). 협찬 표시는 모든 미션에 기본으로 들어갑니다.
  "5점 주세요", "맛있다고 써 주세요"처럼 내용을 지시하는 조건은 받지 않습니다. 솔직한 방문 후기가 매장에 더 오래 남는 자산이라는 점을 설명합니다.
