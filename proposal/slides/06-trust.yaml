layout: grid
title: 허위 방문과 노쇼를 막는 장치
cards:
  - head: 방문 코드 인증
    body: 신청마다 고유 코드를 발급하고,\n방문 시작 60분 전부터\n종료 시각까지만 인증됩니다
  - head: 노쇼 제재
    body: 노쇼는 벌점이 쌓이고,\n기준을 넘으면 30일 동안 신청이 막힙니다
  - head: 실명 계정 신청
    body: 카카오 로그인 회원만 신청할 수 있고,\n같은 모집 중복 신청은 차단됩니다
  - head: 고칠 수 없는 적립금 내역
    body: 충전·차감·환불 기록은 수정·삭제할 수 없고,\n승인 1건당 차감은 1번뿐입니다
notes: |
  영수증 리뷰 방식은 쓰지 않는다는 원칙을 강조합니다.
